[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pipernet"
version = "0.4.0"
description = "Pied Piper prototype - decentralized P2P storage network core"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["pipernet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
